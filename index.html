<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Silly Socks — 80s Arcade Drop</title>
<style>
/* ===========================================
  80s SYNTHWAVE / MEMPHIS THEME - MOBILE OPTIMIZED
=========================================== */
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Montserrat:ital,wght@0,400;0,800;0,900;1,900&display=swap');

:root {
  /* DARK MODE: SYNTHWAVE */
  --bg: #0b0c10;
  --text: #ffffff;
  --text-muted: #aaaaaa;
  --accent-1: #ff00ff; 
  --accent-2: #00ffff; 
  --accent-3: #ffff00; 
  --card-bg: rgba(20, 10, 30, 0.85);
  --card-border: #ff00ff;
  --grid-line: rgba(0, 255, 255, 0.4);
  --grid-glow: rgba(255, 0, 255, 0.3);
  --font-main: 'Montserrat', sans-serif;
  --font-retro: 'Press Start 2P', cursive;
  --shadow-retro: 0 0 10px var(--accent-1), 0 0 20px var(--accent-2);
}

[data-theme="light"] {
  /* LIGHT MODE: 80s MEMPHIS DESIGN */
  --bg: #f4f4f4;
  --text: #111111;
  --text-muted: #555555;
  --accent-1: #ff007f; 
  --accent-2: #00e5ff; 
  --accent-3: #ffea00; 
  --card-bg: #ffffff;
  --card-border: #111111;
  --grid-line: rgba(0, 0, 0, 0.1);
  --grid-glow: transparent;
  --shadow-retro: 6px 6px 0px var(--card-border);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-main);
  background-color: var(--bg);
  color: var(--text);
  overflow-x: hidden;
  height: 100vh;
  overflow-y: hidden;
  transition: background-color 0.5s, color 0.5s;
}

/* --- 80s PERSPECTIVE GRID --- */
.synth-grid {
  position: fixed; bottom: -20vh; left: -50vw; width: 200vw; height: 70vh;
  background-image: 
    linear-gradient(var(--grid-line) 2px, transparent 2px),
    linear-gradient(90deg, var(--grid-line) 2px, transparent 2px);
  background-size: 50px 50px;
  transform: perspective(600px) rotateX(70deg);
  transform-origin: top; z-index: -2;
  animation: gridScroll 2s linear infinite;
  box-shadow: 0 -40px 100px var(--grid-glow);
}
@keyframes gridScroll {
  0% { transform: perspective(600px) rotateX(70deg) translateY(0); }
  100% { transform: perspective(600px) rotateX(70deg) translateY(50px); }
}

/* Memphis background elements for Light Mode */
.memphis-shapes { position: fixed; top:0; left:0; width:100%; height:100%; z-index:-1; pointer-events: none; opacity: 0; transition: opacity 0.5s; }
[data-theme="light"] .memphis-shapes { opacity: 1; }
.shape { position: absolute; border: 4px solid var(--card-border); }
.circle { border-radius: 50%; width: 80px; height: 80px; background: var(--accent-3); top: 10%; left: 5%; animation: float 10s infinite alternate; }
.triangle { width: 0; height: 0; border-left: 50px solid transparent; border-right: 50px solid transparent; border-bottom: 80px solid var(--accent-1); border-top: none; background: transparent; top: 70%; right: 10%; animation: float 12s infinite alternate-reverse; }
.squiggle { width: 120px; height: 15px; background: repeating-linear-gradient(45deg, var(--accent-2), var(--accent-2) 10px, transparent 10px, transparent 20px); top: 25%; right: 15%; animation: spin 15s linear infinite; }

@keyframes float { 0% {transform: translateY(0) rotate(0deg);} 100% {transform: translateY(30px) rotate(15deg);} }
@keyframes spin { 100% {transform: rotate(360deg);} }

/* --- HERO SECTION --- */
#hero {
  position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 5000; background: var(--bg);
  transition: transform 1s cubic-bezier(0.8, -0.2, 0.2, 1.5), opacity 1s ease;
  cursor: pointer;
}
.hero-logo {
  font-family: var(--font-retro); font-size: clamp(24px, 6vw, 60px); text-align: center;
  color: #fff; text-shadow: 0 0 10px var(--accent-1), 4px 4px 0px var(--accent-2);
  margin-bottom: 20px; z-index: 10; animation: pulseLogo 2s infinite alternate; padding: 0 15px;
}
@keyframes pulseLogo {
  0% { transform: scale(1) skewX(0deg); text-shadow: 0 0 10px var(--accent-1), 4px 4px 0px var(--accent-2); }
  100% { transform: scale(1.05) skewX(-5deg); text-shadow: 0 0 25px var(--accent-1), 6px 6px 0px var(--accent-2); }
}
.hero-prompt {
  font-family: var(--font-retro); font-size: clamp(10px, 3vw, 14px); color: var(--accent-3);
  animation: blink 1s steps(2, start) infinite; z-index: 10; text-align: center; padding: 0 10px; line-height: 1.5;
}
@keyframes blink { to { visibility: hidden; } }

#sock-rain { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; pointer-events: none; }
.falling-sock { position: absolute; top: -10%; font-size: 35px; animation: dropSock linear infinite; filter: drop-shadow(0 0 10px var(--accent-1)); }
@keyframes dropSock { 0% { transform: translateY(-10vh) rotate(0deg); } 100% { transform: translateY(110vh) rotate(360deg); } }

/* --- REUSABLE RETRO BOX --- */
.retro-box {
  width: 90%; max-width: 500px; text-align: center; padding: 2.5rem 1.5rem;
  background: var(--card-bg); border: 4px solid var(--card-border);
  box-shadow: var(--shadow-retro); position: relative; margin: 0 auto;
}
.retro-box::before {
  content: ''; position: absolute; top: 5px; left: 5px; right: 5px; bottom: 5px;
  border: 1px dashed var(--accent-2); pointer-events: none;
}
.retro-btn {
  padding: 12px 15px; background: var(--accent-1); color: #fff; border: 3px solid var(--card-border);
  font-family: var(--font-retro); font-size: 10px; cursor: pointer;
  transition: all 0.2s; box-shadow: 4px 4px 0 var(--accent-2); text-transform: uppercase; margin: 5px;
}
.retro-btn:hover { background: var(--accent-2); color: #000; box-shadow: 4px 4px 0 var(--accent-1); transform: translate(-2px, -2px); }
.retro-btn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 transparent; }

/* --- TIC-TAC-TOE SECTION --- */
#tictactoe-screen {
  min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
  position: relative; z-index: 15; display: none; opacity: 0;
  transform: scale(0.8); transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
#tictactoe-screen.visible { opacity: 1; transform: scale(1); }

.ttt-board {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; 
  width: 100%; max-width: 280px; margin: 20px auto; aspect-ratio: 1/1;
  background: var(--card-border); border: 4px solid var(--card-border); box-shadow: 0 0 20px rgba(0,0,0,0.5);
}
.ttt-cell {
  background: var(--bg); display: flex; align-items: center; justify-content: center;
  font-family: var(--font-retro); font-size: clamp(30px, 8vw, 40px); cursor: pointer; transition: background 0.2s;
}
.ttt-cell:hover { background: rgba(255,255,255,0.1); }
.ttt-cell.x { color: var(--accent-1); text-shadow: 0 0 15px var(--accent-1); }
.ttt-cell.o { color: var(--accent-2); text-shadow: 0 0 15px var(--accent-2); }

#ttt-status { font-family: var(--font-retro); font-size: 10px; color: var(--accent-3); margin-top: 10px; line-height: 1.6; animation: pulseLogo 1.5s infinite alternate;}

/* --- LEADERBOARD & INPUT --- */
#ttt-win-form { display: none; margin-top: 20px; }
.ticker-wrap {
  width: 100%; overflow: hidden; background: #000; color: var(--accent-3);
  padding: 8px 0; font-family: var(--font-retro); font-size: 10px;
  border-bottom: 2px dashed var(--accent-3); white-space: nowrap;
}
.ticker { display: inline-block; white-space: nowrap; animation: ticker 20s linear infinite; }
.ticker span { margin-right: 30px; }
@keyframes ticker { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-50%, 0, 0); } }

/* --- GATE SECTION --- */
#gate {
  min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
  position: relative; z-index: 10; display: none; opacity: 0;
  transform: scale(0.8); transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
#gate.visible { opacity: 1; transform: scale(1); }

.lock-icon { font-size: 40px; margin-bottom: 15px; filter: drop-shadow(0 0 10px var(--accent-3)); }
.gate-title { font-family: var(--font-retro); font-size: 16px; line-height: 1.5; margin-bottom: 15px; color: var(--accent-1); text-shadow: 2px 2px 0 #000; }
.gate-sub { font-size: 11px; font-weight: 800; font-family: var(--font-retro); color: var(--text-muted); margin-bottom: 2rem; line-height: 1.8;}

.input-row { display: flex; flex-direction: row; gap: 10px; margin-bottom: 15px; justify-content: center; align-items: center;}
.retro-input {
  flex: 1; min-width: 0; padding: 12px; background: #000; border: 3px solid var(--card-border);
  color: #0f0; font-family: var(--font-retro); font-size: 10px; outline: none;
  box-shadow: inset 0 0 10px rgba(0,255,0,0.2); text-transform: uppercase;
}
.retro-input:focus { border-color: var(--accent-2); box-shadow: inset 0 0 15px var(--accent-2); }
#errMsg { font-family: var(--font-retro); font-size: 10px; color: var(--accent-1); min-height: 20px; display: none; }

/* --- CATALOG UI --- */
#catalog { display: none; min-height: 100vh; opacity: 0; transform: translateY(100px); transition: all 0.8s cubic-bezier(0.2, 1, 0.3, 1); padding-bottom: 50px; }
#catalog.visible { opacity: 1; transform: translateY(0); }

.cat-header {
  background: var(--card-bg); border-bottom: 4px solid var(--card-border);
  padding: 1.5rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 15px;
  position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow-retro);
}
.header-logo { font-family: var(--font-retro); font-size: clamp(16px, 4vw, 20px); color: var(--accent-2); text-shadow: 2px 2px 0 var(--accent-1); }

.welcome-pill { 
  display: flex; align-items: center; flex-wrap: wrap; gap: 10px;
  border: 2px solid var(--accent-3); padding: 8px 12px; font-family: var(--font-retro); 
  font-size: 10px; color: var(--accent-3); background: #000;
}
.theme-toggle-btn {
  background: var(--bg); color: var(--text); font-weight: 900; font-family: var(--font-retro);
  font-size: 8px; text-transform: uppercase; cursor: pointer;
  border: 2px solid var(--accent-3); padding: 6px 10px;
  box-shadow: 2px 2px 0 var(--accent-3); transition: all 0.2s; margin: 0;
}
.theme-toggle-btn:active { transform: translate(2px, 2px); box-shadow: none; }
.theme-toggle-btn:hover { background: var(--accent-3); color: #000; }

.disc-bar {
  background: var(--accent-1); padding: 10px 1rem; text-align: center; font-size: 10px; font-family: var(--font-retro);
  color: #fff; line-height: 1.6; border-bottom: 4px solid #000;
}

.cat-body { max-width: 1200px; margin: 0 auto; padding: 3rem 1.5rem 0; }
.section-label {
  font-family: var(--font-retro); font-size: 14px; color: var(--text);
  margin-bottom: 2rem; text-shadow: 2px 2px 0 var(--accent-1); line-height: 1.4;
}

/* --- RETRO PRODUCT CARDS --- */
.cam-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 30px; }
.cam-card {
  background: var(--card-bg); border: 4px solid var(--card-border);
  position: relative; transition: all 0.2s ease;
  box-shadow: 6px 6px 0 var(--accent-1);
}
@media (hover: hover) {
  .cam-card:hover { transform: translate(-4px, -4px); box-shadow: 10px 10px 0 var(--accent-2); }
  .cam-card:hover .cam-img { transform: scale(1.08); filter: contrast(110%); }
}

.img-wrapper { width: 100%; height: 200px; border-bottom: 4px solid var(--card-border); background: #ffffff; overflow: hidden; position: relative;}
.cam-img { width: 100%; height: 100%; object-fit: contain; padding: 10px; transition: transform 0.5s; }

.stock-tag { position: absolute; top: 10px; right: 10px; background: var(--accent-3); color: #000; font-family: var(--font-retro); font-size: 8px; padding: 6px 10px; border: 2px solid #000; z-index: 10;}

.cam-info { padding: 15px; }
.cam-name { font-family: var(--font-retro); font-size: 12px; margin-bottom: 10px; color: var(--accent-2); text-shadow: 1px 1px 0 #000; line-height: 1.4;}
.cam-vibe { font-size: 13px; font-weight: 900; color: var(--text-muted); margin-bottom: 15px; text-transform: uppercase;}
.cam-perks { margin-bottom: 15px; display: flex; flex-direction: column; gap: 6px; background: #000; padding: 12px; border: 2px dashed var(--accent-1); color: #fff;}
.perk { font-size: 11px; font-weight: 700; font-family: var(--font-main); letter-spacing: 1px;}

.variant-toggle { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
.toggle-opt { font-size: 12px; font-weight: 900; display: flex; align-items: center; gap: 10px; cursor: pointer; text-transform: uppercase; }
.toggle-opt input {
  appearance: none; width: 14px; height: 14px; border: 2px solid var(--card-border);
  background: var(--bg); cursor: pointer; position: relative; border-radius: 0; min-width: 14px;
}
.toggle-opt input:checked { background: var(--accent-2); border-color: var(--accent-2); box-shadow: 2px 2px 0 var(--accent-1); }

.price-row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 15px; padding-top: 15px; border-top: 2px solid var(--card-border); flex-wrap: wrap;}
.old-price { font-size: 13px; color: var(--text-muted); text-decoration: line-through; font-weight: 900; }
.new-price { font-family: var(--font-retro); font-size: 16px; color: var(--accent-3); text-shadow: 1px 1px 0 #000;}
.disc-tag { font-family: var(--font-retro); font-size: 8px; background: var(--accent-1); padding: 4px 6px; color: #fff; border: 1px solid #000; }

.buy-btn {
  width: 100%; padding: 15px; background: var(--accent-1); color: #fff; border: 3px solid var(--card-border);
  font-family: var(--font-retro); font-size: 12px; cursor: pointer;
  box-shadow: 4px 4px 0 var(--card-border); transition: all 0.2s;
}
.buy-btn:hover { background: var(--accent-2); color: #000; transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--card-border); }
.buy-btn:active { transform: translate(4px, 4px); box-shadow: 0 0 0 transparent; }

/* Tabs */
.page-nav { display: flex; gap: 10px; padding: 0 1rem; margin-top: 2rem; justify-content: center; flex-wrap: wrap;}
.page-tab { background: var(--bg); border: 3px solid var(--card-border); padding: 10px 15px; font-family: var(--font-retro); font-size: 9px; color: var(--text); cursor: pointer; box-shadow: 4px 4px 0 var(--card-border); transition: all 0.2s; line-height: 1.4;}
.page-tab.active { background: var(--accent-1); color: #fff; transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--card-border); }

.footer { text-align: center; padding: 3rem 1.5rem; font-family: var(--font-retro); font-size: 9px; color: var(--text-muted); border-top: 2px dashed var(--card-border); margin-top: 3rem; line-height: 2;}

/* --- IG FLOATING BUTTON --- */
.ig-float-btn {
  position: fixed; bottom: 20px; right: 20px; width: 50px; height: 50px;
  background: var(--accent-1); display: flex; align-items: center; justify-content: center;
  border: 3px solid var(--card-border); cursor: pointer; z-index: 9999;
  box-shadow: 4px 4px 0 var(--card-border); transition: all 0.2s;
}
.ig-float-btn:active { transform: translate(4px, 4px); box-shadow: 0 0 0 transparent; }
.ig-float-btn svg { width: 24px; height: 24px; fill: #fff; }

/* Mobile Specific Overrides */
@media(max-width: 480px) {
  .input-row { flex-direction: column; align-items: stretch; }
  .retro-btn { width: 100% !important; padding: 15px; }
  .cat-header { flex-direction: column; align-items: center; text-align: center; }
  .welcome-pill { justify-content: center; text-align: center; }
  .theme-toggle-btn { margin-left: 0; margin-top: 5px; }
}
</style>
</head>
<body>

<div class="memphis-shapes">
  <div class="shape circle"></div>
  <div class="shape triangle"></div>
  <div class="shape squiggle"></div>
</div>

<div class="synth-
